name: Visual audit 13 apps
on:
  push:
    paths:
      - .github/workflows/visual-audit.yml
      - scripts/visual_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture all 13 published apps
        run: python scripts/visual_audit.py
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-13-apps
          path: browser-audit/
          retention-days: 14
