name: Update and deploy Craft Suite Web
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_lock:
        description: Build committed release-lock.json (rollback / reproducible deploy)
        type: boolean
        default: false
  schedule:
    # UTC. 04:17 Adelaide daylight time / 03:17 standard time. May be delayed by GitHub.
    - cron: '47 17 * * *'

permissions:
  contents: read

concurrency:
  group: craft-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.changed.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Resolve official releases
        if: ${{ !inputs.use_lock }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build.py --resolve-only
      - name: Detect scheduled changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/check_changed.py
      - uses: actions/cache@v4
        if: steps.changed.outputs.publish == 'true'
        with:
          path: .cache
          key: craft-archives-${{ hashFiles('release-lock.json') }}
          restore-keys: craft-archives-
      - name: Assemble and verify all 13 apps
        if: steps.changed.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build.py --locked
      - name: Save reproducible version list
        if: steps.changed.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-lock
          path: release-lock.json
          retention-days: 30
      - name: Upload Pages site
        if: steps.changed.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
